<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ page.title or site.title }}</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: Georgia, "Times New Roman", serif; color: #111; background: #fff; }
  main { max-width: 32rem; padding: 2rem; text-align: center; line-height: 1.5; }
  h1 { font-weight: normal; font-size: 1.4rem; margin: 0 0 1rem; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>{{ page.title or site.title }}</h1>
  {{ page.body|safe }}
</main>
</body>
</html>
